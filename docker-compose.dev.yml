version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: dev-secret-key-do-not-use-in-prod
      JWT_EXPIRES_IN: 7d
      DB_PATH: /data/devtoolkit.sqlite
    volumes:
      - backend_data:/data
    ports:
      - "3001:3001"
    networks:
      - app-network

volumes:
  backend_data:

networks:
  app-network:
    driver: bridge
